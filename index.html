<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>献立・買い物リスト</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4CAF50">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-title" content="もえもえリストあぷり">
</head>
<body>

  <!-- stock.htmlへの移動リンク -->
  <div style="margin: 12px 16px 0 16px;">
    <a href="stock.html" style="display: block; text-align: center; background-color: #2e7d32; color: white; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 0.95rem;">
      📅 献立スケジュール＆在庫管理へ ➔
    </a>
  </div>

  <!-- メインタブボタン -->
  <div class="tab-menu">
    <button id="tabBtn1" class="tab-btn active" onclick="switchTab('tab1')">🛒 買い物</button>
    <button id="tabBtn2" class="tab-btn" onclick="switchTab('tab2')">🥦 食材登録</button>
    <button id="tabBtn3" class="tab-btn" onclick="switchTab('tab3')">📝 献立</button>
  </div>

  <!-- タブ1: 買い物画面 -->
  <div id="tab1" class="tab-content active">
    <!-- 選択カード（リスト作成後に非表示） -->
    <section class="card" id="menuSelectCard">
      
      <!-- 「献立から」と「食材一覧から」のサブ切り替えボタン -->
      <div class="sub-tab-menu">
        <button id="subTabMenuBtn" class="sub-tab-btn active" onclick="switchSubTab('menu')">🍳 献立から選ぶ</button>
        <button id="subTabIngBtn" class="sub-tab-btn" onclick="switchSubTab('ingredient')">🥦 食材一覧から選ぶ</button>
      </div>

      <!-- 1. 献立選択エリア -->
      <div id="subTabMenuContent">
        <div id="menuList"></div>
      </div>

      <!-- 2. 食材直接選択エリア -->
      <div id="subTabIngContent" style="display: none;">
        <div id="selectIngList"></div>
      </div>

      <button onclick="generateShoppingList()" class="primary-btn" style="margin-top: 16px;">🛒 買い物リストを作成</button>
      
      <!-- 選択中の項目をボタン下にリアルタイム表示するエリア -->
      <div id="selectedItemsSummary"></div>

    </section>

    <!-- 買い物リストカード（初期状態は非表示） -->
    <section class="card highlight" id="shoppingListCard" style="display: none;">
      <button onclick="backToMenuSelect()" class="secondary-btn" style="margin-top: 0; margin-bottom: 12px;">🔙 選ぶ画面に戻る</button>
      
      <!-- 直接スケジュール管理へ送信するボタン -->
      <button type="button" onclick="sendToScheduleApp()" style="background:#2e7d32; color:white; border:none; border-radius:8px; padding:12px 16px; font-weight:bold; cursor:pointer; width:100%; margin-bottom:12px; font-size: 0.95rem;">
        📅 この献立をスケジュール管理に送信して蓄積 ➔
      </button>
      
      <!-- 金額サマリーエリア -->
      <div class="price-summary">
        <div class="price-row-main">
          🛒 カゴの中（8%税込）: <span id="purchasedTax">0</span> 円
          <div class="price-sub-text">税抜: <span id="purchasedPrice">0</span> 円</div>
        </div>
        <div class="price-row-sub">
          <span>予定税込: <span id="totalTax">0</span>円 (<span id="totalPrice">0</span>円)</span>
          <span>残税込: <span id="remainingTax">0</span>円 (<span id="remainingPrice">0</span>円)</span>
        </div>
      </div>

      <ul id="shoppingList"></ul>
    </section>
  </div>

  <!-- タブ2: 食材登録画面 -->
  <div id="tab2" class="tab-content">
    <section class="card">
      <h2>🥦 1件ずつ食材登録</h2>
      <input type="text" id="masterIngName" placeholder="食材名 (例: にんじん)">
      <input type="number" id="masterIngPrice" placeholder="価格 (円)">
      <button onclick="saveMasterIngredient()" class="primary-btn">食材を登録</button>
    </section>

    <section class="card highlight">
      <h2>📋 テキスト一括貼り付け登録</h2>
      <p style="font-size: 0.8rem; color: #666; margin-bottom: 8px;">
        レシート読み取りテキストやメモをそのまま貼り付けてください。<br>
        例：<code>豚肉 300</code> または <code>人参,100</code>（1行に1食材）
      </p>
      <textarea id="bulkIngInput" rows="5" placeholder="豚肉 300&#10;人参 100&#10;玉ねぎ 150"></textarea>
      <button onclick="saveBulkIngredients()" class="primary-btn">一括で登録する</button>
    </section>

    <section class="card">
      <h2>登録済み食材一覧</h2>
      <div id="masterIngList"></div>
    </section>
  </div>

  <!-- タブ3: 献立画面 -->
  <div id="tab3" class="tab-content">
    <section class="card">
      <h2>＋ 新しい献立の登録</h2>
      <input type="text" id="menuName" placeholder="献立名 (例: カレー)">
      <div id="ingredientInputs"></div>
      <button onclick="addIngredientRow()">＋ 材料を追加</button>
      <button onclick="saveMenu()" class="primary-btn">献立を保存</button>
    </section>

    <section class="card">
      <h2>登録済み献立一覧（編集・削除）</h2>
      <div id="manageMenuList"></div>
    </section>
  </div>

  <script src="app.js"></script>
  <script>
    // 選択された献立を stock.html の「今週の予定」へ直接送信する関数
    function sendToScheduleApp() {
      // app.js内の関数を使って選択中の献立データを取得
      const selection = getSelectedItemsData();
      const selectedMenus = selection.selectedMenus;

      if (!selectedMenus || selectedMenus.length === 0) {
        alert('送信する献立が選択されていません！リストから献立を選んでください。');
        return;
      }

      // stock.htmlと合わせ、今週の予定(currentSchedules)と在庫(stockIngredients)を取得
      let currentSchedules = JSON.parse(localStorage.getItem('currentSchedules')) || [];
      let stockIngredients = JSON.parse(localStorage.getItem('stockIngredients')) || {};

      // 選択された献立を「今週の予定」に追加
      selectedMenus.forEach(item => {
        const menuObj = menus.find(m => m.id === item.id);
        if (!menuObj) return;

        // 数量（qty）の分だけ予定リストに展開して追加
        for (let i = 0; i < (item.qty || 1); i++) {
          currentSchedules.push({
            id: Date.now() + Math.random(),
            name: menuObj.name,
            day: '未定', // デフォルトの曜日
            time: '昼',  // デフォルトの時間
            ingredients: menuObj.ingredients ? menuObj.ingredients.map(ing => ing.name) : []
          });
        }

        // 食材在庫リストにも自動追加
        if (menuObj.ingredients) {
          menuObj.ingredients.forEach(ing => {
            if (ing.name && stockIngredients[ing.name] === undefined) {
              stockIngredients[ing.name] = 1; // 初期値1
            }
          });
        }
      });

      // 正しいキー名（currentSchedules）でローカルストレージに保存
      localStorage.setItem('currentSchedules', JSON.stringify(currentSchedules));
      localStorage.setItem('stockIngredients', JSON.stringify(stockIngredients));

      // stock.htmlへ移動
      window.location.href = 'stock.html';
    }
  </script>
</body>
</html>
